{% extends "base.html" %}
{% load static %}

{% block title %}Sign In Via Google | SEO Audit{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-glass" data-aos="zoom-in" style="text-align: center;">
        <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center rounded-3" style="width:56px;height:56px;background: #fff; color: #4285F4; font-size:1.6rem; box-shadow: 0 2px 12px rgba(0,0,0,0.15);"><i class="bi bi-google" aria-hidden="true"></i></div>
        <h2 class="fw-bold mb-2">Sign in via Google</h2>
        <p class="text-muted small mb-4">You are about to sign in using your Google account. This will create an account if you don't have one.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="border-radius:10px;">
                <svg width="18" height="18" viewBox="0 0 24 24" class="me-2" aria-hidden="true" style="vertical-align: -3px;"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09A6.97 6.97 0 0 1 5.48 12c0-.72.13-1.43.36-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.16-3.16C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
        </form>

        <div class="mt-4">
            <a href="{% url 'accounts:login' %}" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
